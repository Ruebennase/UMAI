<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application A — UMAI Background Sync</title>
  <link rel="stylesheet" href="/style.css?v=0.1.6">
  <style>
    body {
      background: #f8fafc;
      padding: 8px;
      font-size: 12px;
      height: auto;
      min-height: 100%;
      overflow: auto;
    }
    .sync-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      max-width: 380px;
      margin: 0 auto;
    }
    .sync-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      display: inline-block;
      box-shadow: 0 0 6px rgba(22, 163, 74, 0.6);
    }
    .pulse-dot.syncing {
      background-color: var(--warning);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- State 1: Authenticated & Running -->
  <div id="sync-active-container" class="sync-card" style="display: none;">
    <div class="sync-status-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="sync-dot" class="pulse-dot"></span>
        <strong id="sync-title">App A Sync Worker</strong>
      </div>
      <span id="sync-detail" style="color: var(--text-muted); font-size: 11px;">In Sync</span>
    </div>
  </div>

  <!-- State 2: Unauthenticated -->
  <div id="sync-auth-container" class="sync-card" style="display: none;">
    <div style="margin-bottom: 6px; font-weight: 600; color: var(--danger);">
      🔒 Application A Login Required
    </div>
    <p style="color: var(--text-muted); font-size: 11px; margin-bottom: 8px;">
      Authenticate Application A to enable background synchronization.
    </p>
    <form id="sync-login-form">
      <div style="display: flex; gap: 6px; margin-bottom: 6px;">
        <input type="text" id="sync-username" value="admin" placeholder="User" style="flex: 1; padding: 4px 6px; font-size: 11px;" required>
        <input type="password" id="sync-password" value="umai123" placeholder="Pass" style="flex: 1; padding: 4px 6px; font-size: 11px;" required>
      </div>
      <div style="display: flex; gap: 6px;">
        <button type="submit" class="btn btn-sm" style="flex: 1;">Sign In to App A</button>
        <button type="button" id="btn-popup-auth" class="btn btn-secondary btn-sm" title="Open Application A in a first-party companion window for login and direct MessageChannel sync">Companion Window ↗</button>
      </div>
      <div id="sync-login-error" style="color: var(--danger); font-size: 11px; margin-top: 4px; display: none;"></div>
    </form>
  </div>

  <script src="/js/umai.js?v=0.1.7"></script>
  <script src="/js/umai-spool.js?v=0.1.7"></script>
  <script src="/sync.js?v=0.1.7"></script>
</body>
</html>
